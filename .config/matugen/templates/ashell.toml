[appearance]
opacity = 1.0
font_name = "Maple Mono NF"

background_color = "{{ colors.surface.default.hex }}"
primary_color = "{{ colors.primary.default.hex }}"
success_color = "{{ colors.secondary.default.hex }}"
warning_color = "{{ colors.tertiary_container.default.hex }}"
danger_color = "{{ colors.error.default.hex }}"
text_color = "{{ colors.on_surface.default.hex }}"

workspace_colors = [
    "{{ colors.primary.default.hex }}",
    "{{ colors.secondary.default.hex }}"
]

[appearance.bar]
surface = "solid"

[modules]
left = ["Workspaces", "MediaPlayer"]
center = ["Tempo"]
right = ["SystemInfo", "Settings", "Tray"]

[workspaces]
visibility_mode = "All"
indicator_format = "Name"
group_by_monitor = false

[media_player]
max_text_length = 20
indicator_format = "Text"
indicator_fields = ["Title"]
indicator_visualizer = "After"
menu_visualizer = true
visualizer_framerate = 30

[system_info]
indicators = ["Cpu", "Memory", "Temperature"]
interval = 5

[tempo]
clock_format = "%R"

[settings]
battery_format = "IconAndPercentage"
volume_step = 5
max_volume = 100
enable_tooltips = true
